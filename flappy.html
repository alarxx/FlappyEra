<body>
<div id="game-wrapper">
    <canvas id="game" width="320" height="480"></canvas>
</div>

<script>
/* === МИРОВЫЕ НАСТРОЙКИ (как в World/GameScreen) === */
const WORLD_WIDTH = 10.0;
const WORLD_HEIGHT = 15.0;

// Масштаб: мир -> пиксели
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const SCALE_X = canvas.width / WORLD_WIDTH;
const SCALE_Y = canvas.height / WORLD_HEIGHT;

// Утилиты для конвертации
function worldToScreenX(x) { return x * SCALE_X; }
function worldToScreenY(y) { return canvas.height - y * SCALE_Y; } // y вверх
function worldToScreenW(w) { return w * SCALE_X; }
function worldToScreenH(h) { return h * SCALE_Y; }

// Простейший Rect
class Rect {
    constructor(x, y, w, h) {
        this.x = x; // center x (как GameObject.position)
        this.y = y; // center y
        this.w = w;
        this.h = h;
    }
    get left() { return this.x - this.w / 2; }
    get right() { return this.x + this.w / 2; }
    get bottom() { return this.y - this.h / 2; }
    get top() { return this.y + this.h / 2; }

    intersects(other) {
        return !(this.right < other.left ||
                 this.left > other.right ||
                 this.top < other.bottom ||
                 this.bottom > other.top);
    }

    containsPoint(px, py) {
        return px >= this.left && px <= this.right &&
               py >= this.bottom && py <= this.top;
    }
}

/* === АТЛАС (аналог Assets.backgroundRegion, .down, .columnT, .columnB, .bird, .coin) === */
// Подгони координаты под свой background.png (см. Assets.java)
const atlas = new Image();
atlas.src = '/static/background.png'; // один PNG-атлас

const regions = {
    // полный фон
    backgroundRegion: { sx: 0,   sy: 0,   sw: 320, sh: 480 },
    // земля (DownTown)
    down:             { sx: 320, sy: 480, sw: 320, sh: 64  },

    // колонны
    columnT:          { sx: 384, sy: 0,   sw: 64,  sh: 176 },
    columnB:          { sx: 448, sy: 0,   sw: 64,  sh: 176 },

    // птица и монетка
    bird:             { sx: 576, sy: 0,   sw: 64,  sh: 64  },
    coin:             { sx: 576, sy: 64,  sw: 64,  sh: 64  }
};

function drawRegion(region, x, y, w, h, angleDeg = 0) {
    const dx = worldToScreenX(x);
    const dy = worldToScreenY(y);
    const dw = worldToScreenW(w);
    const dh = worldToScreenH(h);

    ctx.save();
    ctx.translate(dx, dy);
    ctx.rotate(-angleDeg * Math.PI / 180); // в JS угол по часовой, в нашем мире y вверх
    ctx.drawImage(
        atlas,
        region.sx, region.sy, region.sw, region.sh,
        -dw / 2, -dh / 2, dw, dh
    );
    ctx.restore();
}

/* === Background (как Background.java) === */
class Background {
    constructor() {
        this.W = WORLD_WIDTH;
        this.H = WORLD_HEIGHT;

        const vel = -1.0;

        this.bc1 = {
            x: 0,
            y: this.H / 2,
            vx: vel
        };
        this.bc2 = {
            x: this.W,
            y: this.H / 2,
            vx: vel
        };
    }

    update(dt) {
        const halfW = this.W / 2;

        this.bc1.x += this.bc1.vx * dt;
        if (this.bc1.x < -halfW) {
            this.bc1.x = 1.5 * this.W;
        }

        this.bc2.x += this.bc2.vx * dt;
        if (this.bc2.x < -halfW) {
            this.bc2.x = 1.5 * this.W;
        }
    }

    render() {
        drawRegion(regions.backgroundRegion, this.bc2.x, this.bc2.y, this.W + 0.2, this.H);
        drawRegion(regions.backgroundRegion, this.bc1.x, this.bc1.y, this.W, this.H);
    }
}

/* === DownTown (земля) аналог DownTown.java === */
class DownTown {
    constructor() {
        this.W = WORLD_WIDTH;
        this.bc1 = { x: 0, y: 0, vx: -4.5 };
        this.bc2 = { x: this.W, y: 0, vx: -4.5 };
    }

    update(dt) {
        const halfW = this.W / 2;

        this.bc1.x += this.bc1.vx * dt;
        if (this.bc1.x < -halfW) {
            this.bc1.x = 1.5 * this.W;
        }

        this.bc2.x += this.bc2.vx * dt;
        if (this.bc2.x < -halfW) {
            this.bc2.x = 1.5 * this.W;
        }
    }

    render() {
        drawRegion(regions.down, this.bc2.x, this.bc2.y, this.W + 0.2, 2);
        drawRegion(regions.down, this.bc1.x, this.bc1.y, this.W, 2);
    }
}

/* === Bird (аналог Bird.java) === */
class Bird {
    constructor() {
        this.WORLD_W = WORLD_WIDTH;
        this.WORLD_H = WORLD_HEIGHT;

        this.BIRD_WIDTH = 2.0;
        this.BIRD_HEIGHT = 2.0;
        this.BIRD_JUMP_VELOCITY = 9.0;
        this.FALL_VELOCITY = -30.0;

        this.STATE_JUMP = 0;
        this.STATE_FALL = 1;
        this.STATE_HIT = 2;

        this.reset();
    }

    reset() {
        this.x = this.WORLD_W / 4;
        this.y = this.WORLD_H / 2;
        this.vx = 0;
        this.vy = 0;
        this.state = this.STATE_FALL;

        // hitbox (как birdR)
        this.hitbox = new Rect(
            this.x + 0.1,
            this.y,
            this.BIRD_WIDTH / 2 - 0.2,
            this.BIRD_HEIGHT - 0.2
        );

        this.im = 0;
        this.angle = 0;
    }

    update(dt) {
        // Низ
        if (this.y < this.BIRD_HEIGHT / 2 + 1.0) {
            if (this.state !== this.STATE_HIT) {
                this.state = this.STATE_HIT;
            }
        }
        // Верх
        if (this.y > this.WORLD_H - this.BIRD_HEIGHT / 2) {
            if (this.state !== this.STATE_HIT) {
                this.state = this.STATE_HIT;
            }
        }

        if (this.state === this.STATE_HIT) {
            // Падение с отскоком влево, как в Java
            if (this.y > this.BIRD_HEIGHT / 2 + 1.0) {
                this.vy += this.FALL_VELOCITY * dt;
                this.x += -1 * dt;
                this.y += this.vy * dt;
            }
        } else {
            // Обычное падение
            this.vy += this.FALL_VELOCITY * dt;
            this.y += this.vy * dt;
        }

        // Обновление hitbox
        this.hitbox.x = this.x + 0.1;
        this.hitbox.y = this.y;

        // Анимация угла
        if (this.state === this.STATE_HIT) {
            this.angle = 0;
        } else {
            if (this.vy < -3) {
                if (this.state !== this.STATE_FALL) {
                    this.state = this.STATE_FALL;
                    this.im = 0;
                }
                this.angle = -15;
                this.im++;
            } else {
                if (this.state !== this.STATE_JUMP) {
                    this.state = this.STATE_JUMP;
                    this.im = 0;
                }
                this.angle = 15;
                this.im++;
            }
        }
    }

    jump() {
        if (this.state === this.STATE_HIT) return;
        this.vy = this.BIRD_JUMP_VELOCITY;
        this.state = this.STATE_JUMP;
    }

    render() {
        drawRegion(regions.bird, this.x, this.y, this.BIRD_WIDTH, this.BIRD_HEIGHT, this.angle);
    }

    isDead() {
        return this.state === this.STATE_HIT && this.y <= this.BIRD_HEIGHT / 2 + 1.0;
    }
}

/* === Column + Coins (приближённо к Column.java) === */
class ColumnSystem {
    constructor() {
        this.W = WORLD_WIDTH;
        this.H = WORLD_HEIGHT;

        this.COLUMN_WIDTH = 2.5;
        this.COLUMN_HEIGHT = this.H;
        this.COLUMN_DELTA = 3.75;
        this.COIN_SIZE = 2.0;

        this.COLUMN_VELOCITY = -4.5;
        this.minVelocity = -7.0;

        this.scoreColumnBoolean = true;

        // Две пары колонн
        this.reset();
    }

    randY(prevY = null) {
        // r.nextFloat()*(WORLD_HEIGHT - COLUMN_DELTA)+COLUMN_WIDTH/2;
        let y = Math.random() * (this.H - this.COLUMN_DELTA) + this.COLUMN_WIDTH / 2;

        if (y < 4.5) y = 4.5;
        if (y > this.H - this.COLUMN_DELTA - 1.0) y = this.H - this.COLUMN_DELTA - 1.0;

        if (prevY !== null && Math.abs(y - prevY) > 5) {
            while (Math.abs(y - prevY) > 5) {
                if (y - prevY > 0) y -= 1.0;
                else y += 1.0;
            }
        }
        return y;
    }

    reset() {
        this.COLUMN_VELOCITY = -4.5;
        this.scoreColumnBoolean = true;

        // первая
        this.y1 = this.randY();
        this.coin1b = true;
        const x1 = this.W + this.COLUMN_WIDTH / 2;

        this.columnT1 = new Rect(
            x1,
            this.y1 + this.COLUMN_HEIGHT / 2 + this.COLUMN_DELTA / 2,
            this.COLUMN_WIDTH,
            this.COLUMN_HEIGHT
        );
        this.columnB1 = new Rect(
            x1,
            this.y1 - this.COLUMN_HEIGHT / 2 - this.COLUMN_DELTA / 2,
            this.COLUMN_WIDTH,
            this.COLUMN_HEIGHT
        );
        this.coin1 = new Rect(x1, this.y1, this.COIN_SIZE, this.COIN_SIZE);

        // вторая
        this.y2 = this.randY(this.y1);
        this.coin2b = true;
        const x2 = x1 + this.W / 2 + this.COLUMN_WIDTH;

        this.columnT2 = new Rect(
            x2,
            this.y2 + this.COLUMN_HEIGHT / 2 + this.COLUMN_DELTA / 2,
            this.COLUMN_WIDTH,
            this.COLUMN_HEIGHT
        );
        this.columnB2 = new Rect(
            x2,
            this.y2 - this.COLUMN_HEIGHT / 2 - this.COLUMN_DELTA / 2,
            this.COLUMN_WIDTH,
            this.COLUMN_HEIGHT
        );
        this.coin2 = new Rect(x2, this.y2, this.COIN_SIZE, this.COIN_SIZE);
    }

    update(dt, worldWidth) {
        const vx = this.COLUMN_VELOCITY * dt;

        // первая пара
        if (this.columnT1.x > -this.COLUMN_WIDTH / 2) {
            this.columnT1.x += vx;
            this.columnB1.x += vx;
            this.coin1.x += vx;
        } else {
            // ускорение сложности
            if (this.COLUMN_VELOCITY > this.minVelocity) {
                this.COLUMN_VELOCITY -= 0.005;
            }
            this.scoreColumnBoolean = true;
            this.coin1b = true;
            this.y1 = this.randY(this.y2);
            const x = worldWidth + this.COLUMN_WIDTH / 2;
            this.columnT1.x = x;
            this.columnT1.y = this.y1 + this.COLUMN_HEIGHT / 2 + this.COLUMN_DELTA / 2;
            this.columnB1.x = x;
            this.columnB1.y = this.y1 - this.COLUMN_HEIGHT / 2 - this.COLUMN_DELTA / 2;
            this.coin1.x = x;
            this.coin1.y = this.y1;
        }

        // вторая пара
        if (this.columnT2.x > -this.COLUMN_WIDTH / 2) {
            this.columnT2.x += vx;
            this.columnB2.x += vx;
            this.coin2.x += vx;
        } else {
            if (this.COLUMN_VELOCITY > this.minVelocity) {
                this.COLUMN_VELOCITY -= 0.005;
            }
            this.scoreColumnBoolean = true;
            this.coin2b = true;
            this.y2 = this.randY(this.y1);
            const x = worldWidth + this.COLUMN_WIDTH / 2;
            this.columnT2.x = x;
            this.columnT2.y = this.y2 + this.COLUMN_HEIGHT / 2 + this.COLUMN_DELTA / 2;
            this.columnB2.x = x;
            this.columnB2.y = this.y2 - this.COLUMN_HEIGHT / 2 - this.COLUMN_DELTA / 2;
            this.coin2.x = x;
            this.coin2.y = this.y2;
        }
    }

    render() {
        // coin сначала, чтобы трубы были поверх или наоборот — как хочешь
        if (this.coin1b) {
            drawRegion(regions.coin, this.coin1.x, this.coin1.y, this.COIN_SIZE, this.COIN_SIZE);
        }
        if (this.coin2b) {
            drawRegion(regions.coin, this.coin2.x, this.coin2.y, this.COIN_SIZE, this.COIN_SIZE);
        }

        drawRegion(regions.columnT, this.columnT1.x, this.columnT1.y, this.COLUMN_WIDTH, this.COLUMN_HEIGHT);
        drawRegion(regions.columnB, this.columnB1.x, this.columnB1.y, this.COLUMN_WIDTH, this.COLUMN_HEIGHT);
        drawRegion(regions.columnT, this.columnT2.x, this.columnT2.y, this.COLUMN_WIDTH, this.COLUMN_HEIGHT);
        drawRegion(regions.columnB, this.columnB2.x, this.columnB2.y, this.COLUMN_WIDTH, this.COLUMN_HEIGHT);
    }

    // Аналог World.update() — точка в центре прохода
    checkScoreAndCoins(birdRect) {
        let gainedScore = 0;
        let gainedCoins = 0;

        const gap1x = this.columnT1.x;
        const gap1y = this.y1; // центр прохода
        if (this.scoreColumnBoolean && birdRect.containsPoint(gap1x, gap1y)) {
            if (this.coin1b) {
                this.coin1b = false;
                gainedScore += 1;
                gainedCoins += 1;
            }
            this.scoreColumnBoolean = false;
        }

        const gap2x = this.columnT2.x;
        const gap2y = this.y2;
        if (this.scoreColumnBoolean && birdRect.containsPoint(gap2x, gap2y)) {
            if (this.coin2b) {
                this.coin2b = false;
                gainedScore += 1;
                gainedCoins += 1;
            }
            this.scoreColumnBoolean = false;
        }

        return { gainedScore, gainedCoins };
    }

    // столкновения
    collides(birdRect) {
        return birdRect.intersects(this.columnT1) ||
               birdRect.intersects(this.columnB1) ||
               birdRect.intersects(this.columnT2) ||
               birdRect.intersects(this.columnB2);
    }
}

/* === World (аналог World.java + GameScreen) === */
class WorldGame {
    constructor() {
        this.background = new Background();
        this.downTown = new DownTown();
        this.bird = new Bird();
        this.columns = new ColumnSystem();

        this.score = 0;
        this.coinsSession = 0;

        this.highscore = parseInt(localStorage.getItem('flappy_highscore') || '0', 10);
        this.totalCoins = parseInt(localStorage.getItem('flappy_coins') || '0', 10);

        this.gameState = 'menu'; // 'menu' | 'playing' | 'gameover'
    }

    resetToMenu() {
        this.bird.reset();
        this.columns.reset();
        this.score = 0;
        this.coinsSession = 0;
        this.gameState = 'menu';
    }

    startGame() {
        this.bird.reset();
        this.columns.reset();
        this.score = 0;
        this.coinsSession = 0;
        this.gameState = 'playing';
    }

    update(dt) {
        if (dt > 0.05) dt = 0.05;

        if (this.gameState === 'menu') {
            this.background.update(dt);
            this.downTown.update(dt);
            this.bird.state = this.bird.STATE_HIT; // как в MainMenuScreen
            return;
        }

        if (this.gameState === 'playing') {
            this.bird.update(dt);
            this.background.update(dt);
            this.downTown.update(dt);
            this.columns.update(dt, WORLD_WIDTH + this.columns.COLUMN_WIDTH);

            // чек поинты/монетки
            const { gainedScore, gainedCoins } = this.columns.checkScoreAndCoins(this.bird.hitbox);
            if (gainedScore > 0) {
                this.score += gainedScore;
                this.coinsSession += gainedCoins;
                // тут можно проиграть звук coinS
            }

            // пересечение с колоннами
            if (this.columns.collides(this.bird.hitbox)) {
                if (this.bird.state !== this.bird.STATE_HIT) {
                    this.bird.state = this.bird.STATE_HIT;
                    this.bird.vy = 0;
                    // тут можно проиграть звук sasi
                }
            }

            // если окончательно упал на землю → game over
            if (this.bird.isDead()) {
                this.gameOver();
            }
        }

        if (this.gameState === 'gameover') {
            // даём птичке падать, пока не ляжет
            this.bird.update(dt);
        }
    }

    gameOver() {
        // highscore
        if (this.score > this.highscore) {
            this.highscore = this.score;
            localStorage.setItem('flappy_highscore', String(this.highscore));
        }

        // coins
        this.totalCoins += this.coinsSession;
        localStorage.setItem('flappy_coins', String(this.totalCoins));

        this.gameState = 'gameover';
    }

    onTap() {
        if (this.gameState === 'menu') {
            this.startGame();
        } else if (this.gameState === 'playing') {
            this.bird.jump();
            // touchSound тут
        } else if (this.gameState === 'gameover') {
            // если упал на землю → в меню
            if (this.bird.isDead()) {
                this.resetToMenu();
            } else {
                // ещё в полёте — тоже можно подпрыгнуть, но классика: ждём пока упадёт
            }
        }
    }

    render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // фон + земля
        this.background.render();
        this.downTown.render();

        // трубы + монеты
        this.columns.render();

        // птица
        this.bird.render();

        // UI
        ctx.save();
        ctx.font = '20px system-ui';
        ctx.textAlign = 'right';
        ctx.textBaseline = 'top';
        ctx.fillStyle = '#ffffff';

        // score
        ctx.fillText(String(this.score), canvas.width - 16, 8);

        // coins
        ctx.textAlign = 'left';
        ctx.fillText(String(this.totalCoins + this.coinsSession), 32, 8);
        // нарисуем иконку монеты
        drawRegion(regions.coin, 1, WORLD_HEIGHT - 1, 1.5, 1.5);

        // подсказки/надписи
        ctx.textAlign = 'center';

        if (this.gameState === 'menu') {
            ctx.font = '24px system-ui';
            ctx.fillText('tap to start', canvas.width / 2, canvas.height * 0.6);

            ctx.font = '16px system-ui';
            ctx.fillText('HS: ' + this.highscore, canvas.width / 2, canvas.height * 0.1);
        }

        if (this.gameState === 'gameover') {
            ctx.font = '28px system-ui';
            ctx.fillText('GAME OVER', canvas.width / 2, canvas.height * 0.45);

            ctx.font = '16px system-ui';
            ctx.fillText('Score: ' + this.score, canvas.width / 2, canvas.height * 0.55);
            ctx.fillText('HS: ' + this.highscore, canvas.width / 2, canvas.height * 0.62);
            ctx.fillText('Tap to restart', canvas.width / 2, canvas.height * 0.7);
        }

        ctx.restore();
    }
}

/* === Главный цикл === */
const world = new WorldGame();

let lastTime = performance.now();

function loop(time) {
    const dt = (time - lastTime) / 1000;
    lastTime = time;

    world.update(dt);
    world.render();

    requestAnimationFrame(loop);
}

atlas.onload = () => {
    world.resetToMenu();
    requestAnimationFrame(loop);
};

/* === Ввод (аналог TouchToWorld.touch) === */
function onTapEvent(e) {
    e.preventDefault();
    world.onTap();
}

canvas.addEventListener('mousedown', onTapEvent);
canvas.addEventListener('touchstart', onTapEvent, { passive: false });

function resizeCanvas() {
    const aspect = 320 / 480; // твои оригинальные размеры

    let w = window.innerWidth;
    let h = window.innerHeight;

    // реальная пропорция окна
    let winAspect = w / h;

    if (winAspect > aspect) {
        // экран слишком широкий
        w = h * aspect;
    } else {
        // экран слишком высокий
        h = w / aspect;
    }

    canvas.style.width = w + "px";
    canvas.style.height = h + "px";
}

window.addEventListener("resize", resizeCanvas);
resizeCanvas();

</script>
</body>
