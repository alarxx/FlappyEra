<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta name="author" content="Alar Akilbekov">
    <meta name="description" content="FlappyEra Game">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

    <title>FlappyEra</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            background: #000;
            color: #fff;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            background: #000;
            image-rendering: pixelated;
            display: block;
            border: none;
            margin: 0;
            padding: 0;
        }
    </style>
</head>

<body>
    <canvas id="game" width="320" height="480"></canvas>

    <script>
    /* === World/GameScreen === */
    const WORLD_WIDTH = 10.0;
    const WORLD_HEIGHT = 15.0;

    // Масштаб: мир -> пиксели
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const SCALE_X = canvas.width / WORLD_WIDTH;
    const SCALE_Y = canvas.height / WORLD_HEIGHT;

    // Утилиты для конвертации
    function worldToScreenX(x) { return x * SCALE_X; }
    function worldToScreenY(y) { return canvas.height - y * SCALE_Y; } // y вверх
    function worldToScreenW(w) { return w * SCALE_X; }
    function worldToScreenH(h) { return h * SCALE_Y; }


    // GameObject.position
    class Rect {
        constructor(x, y, w, h) {
            this.x = x; // center x
            this.y = y; // center y
            this.w = w;
            this.h = h;
        }
        get left() { return this.x - this.w / 2; }
        get right() { return this.x + this.w / 2; }
        get bottom() { return this.y - this.h / 2; }
        get top() { return this.y + this.h / 2; }

        overlaps(other) {
            return !(this.right < other.left || // полностью слева
                    this.left > other.right || // полностью справа
                    this.top < other.bottom || // полностью снизу
                    this.bottom > other.top); // полностью сверху
        }

        containsPoint(px, py) { // point inside the rect
            return px >= this.left && px <= this.right &&
                py >= this.bottom && py <= this.top;
        }
    }

    const atlas = new Image();
    atlas.src = '/static/background.png';

    const regions = {
        backgroundRegion: { sx: 0,   sy: 0,   sw: 320, sh: 480 }, // 480 + 64 = 544
        down:             { sx: 320, sy: 480, sw: 320, sh: 64  },
        columnT:          { sx: 384, sy: 0,   sw: 64,  sh: 176 }, // 176 * 2 = 352
        columnB:          { sx: 448, sy: 0,   sw: 64,  sh: 176 },
        bird:             { sx: 576, sy: 0,   sw: 64,  sh: 64  },
        coin:             { sx: 576, sy: 64,  sw: 64,  sh: 64  }
    };

    function drawRegion(region, x, y, w, h, angleDeg = 0) {
        const dx = worldToScreenX(x); // координаты центра
        const dy = worldToScreenY(y);
        const dw = worldToScreenW(w);
        const dh = worldToScreenH(h);

        // Без поворота — самый дешёвый путь
        if (angleDeg === 0) {
            ctx.drawImage(
                atlas,
                region.sx, region.sy, region.sw, region.sh,
                dx - dw / 2, dy - dh / 2, dw, dh
            );
        }
        else {
            ctx.save();
            ctx.translate(dx, dy);
            ctx.rotate(-angleDeg * Math.PI / 180); // в JS угол по часовой, в нашем мире y вверх
            // но рисуем относительно левого-верхнего края
            ctx.drawImage(
                atlas,
                region.sx, region.sy, region.sw, region.sh,
                -dw / 2, -dh / 2, dw, dh
            );
            ctx.restore();
        }
    }

    class Background {
        static vel = -1.0;

        constructor() {
            this.bc1 = {
                x: 0,
                y: WORLD_HEIGHT / 2,
            };
            this.bc2 = {
                x: WORLD_WIDTH,
                y: WORLD_HEIGHT / 2,
            };

            this.halfW = WORLD_WIDTH / 2;
        }

        update(dt) {
            let shift = Background.vel * dt;

            this.bc1.x += shift;
            this.bc2.x += shift;
            if (this.bc1.x < -this.halfW) {
                this.bc1.x = 1.5 * WORLD_WIDTH;
                this.bc2.x = 0.5 * WORLD_WIDTH;
            }
            else if (this.bc2.x < -this.halfW) {
                this.bc1.x = 0.5 * WORLD_WIDTH;
                this.bc2.x = 1.5 * WORLD_WIDTH;
            }
        }

        render() {
            drawRegion(regions.backgroundRegion, this.bc2.x, this.bc2.y, WORLD_WIDTH + 0.2, WORLD_HEIGHT);
            drawRegion(regions.backgroundRegion, this.bc1.x, this.bc1.y, WORLD_WIDTH, WORLD_HEIGHT);
        }
    }

    /* === DownTown (земля) аналог DownTown.java === */
    class DownTown {
        static WIDTH = WORLD_WIDTH;
        static HEIGHT = 2; // 64 / 32
        // Magic numbers
        static VELOCITY = -4.5;

        constructor() {
            this.halfW = DownTown.WIDTH / 2;

            this.bc1 = { x: 0, y: 0 };
            this.bc2 = { x: DownTown.WIDTH, y: 0 };
        }

        update(dt) {
            let shift = DownTown.VELOCITY * dt;

            this.bc1.x += shift;
            this.bc2.x += shift;

            if (this.bc1.x < -this.halfW) {
                this.bc1.x = 1.5 * DownTown.WIDTH;
                this.bc2.x = 0.5 * DownTown.WIDTH;
            }
            else if (this.bc2.x < -this.halfW) {
                this.bc1.x = 0.5 * DownTown.WIDTH;
                this.bc2.x = 1.5 * DownTown.WIDTH;
            }
        }

        render() {
            drawRegion(regions.down, this.bc2.x, this.bc2.y, DownTown.WIDTH + 0.2, 2);
            drawRegion(regions.down, this.bc1.x, this.bc1.y, DownTown.WIDTH, 2);
        }
    }

    class Bird {
        static BIRD_WIDTH = 2.0;
        static BIRD_HEIGHT = 2.0;
        static BIRD_JUMP_VELOCITY = 9.0;
        static FALL_VELOCITY = -30.0;

        static STATE_JUMP = 0;
        static STATE_FALL = 1;
        static STATE_HIT = 2;
    
        constructor() {
            this.reset();
        }

        reset() {
            this.x = WORLD_WIDTH / 4;
            this.y = WORLD_HEIGHT / 2;
            this.vx = 0;
            this.vy = 0;
            this.state = Bird.STATE_FALL;

            // hitbox (как birdR)
            this.hitbox = new Rect(
                this.x + 0.1,
                this.y,
                Bird.BIRD_WIDTH / 2 - 0.2,
                Bird.BIRD_HEIGHT - 0.2
            );

            // this.im = 0;
            this.angle = 0;
        }

        hit(){
            this.state = Bird.STATE_HIT;
            this.vy = 10;
        }

        jump() {
            if (this.state === Bird.STATE_HIT) return;
            this.vy = Bird.BIRD_JUMP_VELOCITY;
            this.state = Bird.STATE_JUMP;
        }

        render() {
            drawRegion(regions.bird, this.x, this.y, Bird.BIRD_WIDTH, Bird.BIRD_HEIGHT, this.angle);
        }

        isDead() {
            return this.state === Bird.STATE_HIT && this.y <= Bird.BIRD_HEIGHT / 2 + 1.0;
        }

        update(dt) {
            // Удар об низ
            if (this.y < Bird.BIRD_HEIGHT / 2 + 1.0) {
                if (this.state !== Bird.STATE_HIT) {
                    this.hit();
                }
            }
            // Верх
            if (this.y > Bird.WORLD_H - Bird.BIRD_HEIGHT / 2) {
                if (this.state !== Bird.STATE_HIT) {
                    this.hit();
                }
            }

            if (this.state === Bird.STATE_HIT) {
                // Падение с отскоком влево, как в Java
                if (this.y > Bird.BIRD_HEIGHT / 2 + 1.0) {
                    this.vy += Bird.FALL_VELOCITY * dt;
                    this.x += -1 * dt;
                    this.y += this.vy * dt;
                }
            } else {
                // Обычное падение
                this.vy += Bird.FALL_VELOCITY * dt;
                this.y += this.vy * dt;
            }

            // Обновление hitbox
            this.hitbox.x = this.x + 0.1;
            this.hitbox.y = this.y;

            // Анимация угла
            if (this.state === Bird.STATE_HIT) {
                this.angle = 0;
            } else {
                if (this.vy < -3) {
                    if (this.state !== Bird.STATE_FALL) {
                        this.state = Bird.STATE_FALL;
                        // this.im = 0;
                    }
                    this.angle = -15;
                    // this.im++;
                } else {
                    if (this.state !== Bird.STATE_JUMP) {
                        this.state = Bird.STATE_JUMP;
                        // this.im = 0;
                    }
                    this.angle = 15;
                    // this.im++;
                }
            }
        }

    }

    class ColumnSystem {
        constructor() {
            this.W = WORLD_WIDTH;
            this.H = WORLD_HEIGHT;

            this.COLUMN_WIDTH = 2.25;
            this.COLUMN_HEIGHT = this.H;
            this.COLUMN_DELTA = 3.75;
            this.COIN_SIZE = 2.0;
            this.minVelocity = -6;
            this.COLUMN_VELOCITY = DownTown.VELOCITY;

            this.columns = []; // массив пар колонн
            this.reset();
        }

        randY(prevY = null) {
            let y = Math.random() * (this.H - this.COLUMN_DELTA) + this.COLUMN_WIDTH / 2;

            if (y < 4.5) y = 4.5;
            if (y > this.H - this.COLUMN_DELTA - 1.0) {
                y = this.H - this.COLUMN_DELTA - 1.0;
            }

            if (prevY !== null && Math.abs(y - prevY) > 5) {
                while (Math.abs(y - prevY) > 5) {
                    y += (y > prevY) ? -1.0 : 1.0;
                }
            }

            return y;
        }

        makeColumn(x, y) {
            return {
                yCenter: y,
                scored: false,  // этот проход уже засчитан?
                coinAlive: true,
                top: new Rect(
                    x,
                    y + this.COLUMN_HEIGHT / 2 + this.COLUMN_DELTA / 2,
                    this.COLUMN_WIDTH,
                    this.COLUMN_HEIGHT
                ),
                bottom: new Rect(
                    x,
                    y - this.COLUMN_HEIGHT / 2 - this.COLUMN_DELTA / 2,
                    this.COLUMN_WIDTH,
                    this.COLUMN_HEIGHT
                ),
                coin: new Rect(x, y, this.COIN_SIZE, this.COIN_SIZE),
            };
        }

        reset() {
            this.COLUMN_VELOCITY = DownTown.VELOCITY;
            this.columns.length = 0;

            const y1 = this.randY();
            const x1 = this.W + this.COLUMN_WIDTH / 2;
            this.columns.push(this.makeColumn(x1, y1));

            const y2 = this.randY(y1);
            const x2 = x1 + this.W / 2 + this.COLUMN_WIDTH;
            this.columns.push(this.makeColumn(x2, y2));
        }

        update(dt) {
            const vx = this.COLUMN_VELOCITY * dt;

            for (const col of this.columns) {
                if (col.top.x > -this.COLUMN_WIDTH / 2) {
                    col.top.x += vx;
                    col.bottom.x += vx;
                    col.coin.x += vx;
                } else {
                    if (this.COLUMN_VELOCITY > this.minVelocity) {
                        this.COLUMN_VELOCITY -= 0.005;
                    }

                    const prevY = col.yCenter;
                    col.yCenter = this.randY(prevY);

                    // WORLD_WIDTH + this.columns.COLUMN_WIDTH
                    const x = this.W + 1.5 * this.COLUMN_WIDTH;

                    col.scored = false;
                    col.coinAlive = true;

                    col.top.x = x;
                    col.top.y = col.yCenter + this.COLUMN_HEIGHT / 2 + this.COLUMN_DELTA / 2;

                    col.bottom.x = x;
                    col.bottom.y = col.yCenter - this.COLUMN_HEIGHT / 2 - this.COLUMN_DELTA / 2;

                    col.coin.x = x;
                    col.coin.y = col.yCenter;
                }
            }
        }

        render() {
            for (const col of this.columns) {
                if (col.coinAlive) {
                    drawRegion(regions.coin, col.coin.x, col.coin.y, this.COIN_SIZE, this.COIN_SIZE);
                }
                drawRegion(regions.columnT, col.top.x, col.top.y, this.COLUMN_WIDTH, this.COLUMN_HEIGHT);
                drawRegion(regions.columnB, col.bottom.x, col.bottom.y, this.COLUMN_WIDTH, this.COLUMN_HEIGHT);
            }
        }

        checkScoreAndCoins(birdRect) {
            let gainedScore = 0;
            let gainedCoins = 0;

            for (const col of this.columns) {
                const gapx = col.top.x;
                const gapy = col.yCenter;

                if (!col.scored && birdRect.containsPoint(gapx, gapy)) {
                    col.scored = true;
                    if (col.coinAlive) {
                        col.coinAlive = false;
                        gainedScore += 1;
                        gainedCoins += 1;
                    }
                }
            }
            return { gainedScore, gainedCoins };
        }

        collides(birdRect) {
            for (const col of this.columns) {
                if (birdRect.overlaps(col.top) || birdRect.overlaps(col.bottom)) {
                    return true;
                }
            }
            return false;
        }
        }


    /* === World (аналог World.java + GameScreen) === */
    class WorldGame {
        constructor() {
            this.background = new Background();
            this.downTown = new DownTown();
            this.bird = new Bird();
            this.columns = new ColumnSystem();

            this.highscore = parseInt(localStorage.getItem('flappy_highscore') || '0', 10);
            this.totalCoins = parseInt(localStorage.getItem('flappy_coins') || '0', 10);

            this.resetToMenu();
        }


        reset(state){
            // state = 'menu' | 'playing' | 'gameover'
            this.bird.reset();
            this.columns.reset();
            this.score = 0;
            this.gameState = state;
        }
        resetToMenu() { this.reset('menu'); }
        startGame() { this.reset('playing'); }



        update(dt) {
            // if (dt > 0.05) dt = 0.05;

            if (this.gameState === 'menu') {
                this.background.update(dt);
                this.downTown.update(dt);
                this.bird.state = Bird.STATE_HIT; // как в MainMenuScreen
            }

            else if (this.gameState === 'playing') {
                this.bird.update(dt);
                if(this.bird.state != Bird.STATE_HIT){
                    this.background.update(dt);
                    this.downTown.update(dt);
                    this.columns.update(dt);
                }

                // чек поинты/монетки
                const { gainedScore, gainedCoins } = this.columns.checkScoreAndCoins(this.bird.hitbox);
                if (gainedScore > 0) {
                    this.score += gainedScore;
                    this.totalCoins += gainedCoins;

                    // тут можно проиграть звук coinS
                }

                // пересечение с колоннами
                if (this.columns.collides(this.bird.hitbox)) {
                    if (this.bird.state !== Bird.STATE_HIT) {
                        this.bird.hit();
                        // тут можно проиграть звук sasi
                    }
                }

                // если окончательно упал на землю → game over
                if (this.bird.isDead()) {
                    this.gameOver();
                }
            }

            else if (this.gameState === 'gameover') {
                // даём птичке падать, пока не ляжет
                this.bird.update(dt);
            }
        }

        gameOver() {
            // highscore
            if (this.score > this.highscore) {
                this.highscore = this.score;
                localStorage.setItem('flappy_highscore', String(this.highscore));
            }

            // coins
            localStorage.setItem('flappy_coins', String(this.totalCoins));

            this.gameState = 'gameover';
        }

        onTap() {
            if (this.gameState === 'menu') {
                this.startGame();
            } else if (this.gameState === 'playing') {
                this.bird.jump();
                // touchSound тут
            } else if (this.gameState === 'gameover') {
                // если упал на землю → в меню
                if (this.bird.isDead()) {
                    this.resetToMenu();
                } else {
                    // ещё в полёте — тоже можно подпрыгнуть, но классика: ждём пока упадёт
                }
            }
        }

        render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // фон + земля
            this.background.render();

            // трубы + монеты
            this.columns.render();

            this.downTown.render();

            // птица
            this.bird.render();

            // UI
            ctx.save();
            ctx.font = '20px system-ui';
            ctx.textAlign = 'right';
            ctx.textBaseline = 'top';
            ctx.fillStyle = '#ffffff';

            // score
            ctx.fillText(String(this.score), canvas.width - 16, 8);

            // coins
            ctx.textAlign = 'left';
            ctx.fillText(String(this.totalCoins), 32, 8);
            // нарисуем иконку монеты
            drawRegion(regions.coin, 1, WORLD_HEIGHT - 1, 1.5, 1.5);

            // подсказки/надписи
            ctx.textAlign = 'center';

            if (this.gameState === 'menu') {
                ctx.font = '24px system-ui';
                ctx.fillText('tap to start', canvas.width / 2, canvas.height * 0.6);

                ctx.font = '16px system-ui';
                ctx.fillText('HS: ' + this.highscore, canvas.width / 2, canvas.height * 0.1);
            }

            if (this.gameState === 'gameover') {
                ctx.font = '28px system-ui';
                ctx.fillText('GAME OVER', canvas.width / 2, canvas.height * 0.45);

                ctx.font = '16px system-ui';
                ctx.fillText('Score: ' + this.score, canvas.width / 2, canvas.height * 0.55);
                ctx.fillText('HS: ' + this.highscore, canvas.width / 2, canvas.height * 0.62);
                ctx.fillText('Tap to restart', canvas.width / 2, canvas.height * 0.7);
            }

            ctx.restore();
        }
    }


    // --- Main Loop ---

    const world = new WorldGame();

    let lastTime = performance.now(); // microseconds

    function loop(time) {
        const dt = (time - lastTime) / 1000;
        lastTime = time;

        world.update(dt);
        world.render();

        requestAnimationFrame(loop); // looping
    }

    atlas.onload = () => {
        world.resetToMenu();
        requestAnimationFrame(loop); // start loop
    };

    function onTapEvent(e) {
        e.preventDefault();
        world.onTap();
    }
    canvas.addEventListener('mousedown', onTapEvent); // desktop
    canvas.addEventListener('touchstart', onTapEvent, { passive: false }); // mobile

    // ---


    // --- Canvas Size ---

    const GAME_WIDTH = 320;
    const GAME_HEIGHT = 480 + 64;
    const GAME_ASPECT = GAME_WIDTH / GAME_HEIGHT; // твои оригинальные размеры

    function resizeCanvas() {
        let iw = window.innerWidth;
        let ih = window.innerHeight;

        // real proportion
        let winAspect = iw / ih;

        if (winAspect > GAME_ASPECT) {
            // экран слишком широкий
            iw = ih * GAME_ASPECT;
        } else {
            // экран слишком высокий
            ih = iw / GAME_ASPECT;
        }

        canvas.style.width = iw + "px";
        canvas.style.height = ih + "px";
    }

    window.addEventListener("resize", resizeCanvas);

    resizeCanvas();

    // ---


    </script>
</body>
</html>
